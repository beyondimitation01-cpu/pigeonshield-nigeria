name: KFS Fix Admin OTP Type

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: ${{ !contains(github.event.head_commit.message, 'Fix Admin magic-link token verification type') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply minimal Admin login fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/lib/store.tsx")
          text = path.read_text()
          old = '''        const { error: otpError } = await supabase.auth.verifyOtp({\n          type: "magiclink",\n          token_hash: data.tokenHash,\n        });'''
          new = '''        const { error: otpError } = await supabase.auth.verifyOtp({\n          type: "email",\n          token_hash: data.tokenHash,\n        });'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one Admin OTP block, found {count}")
          updated = text.replace(old, new, 1)
          if old in updated or new not in updated:
              raise SystemExit("Admin OTP replacement verification failed")
          path.write_text(updated)
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/store.tsx .github/workflows/kfs-fix-admin-otp-type.yml
          git commit -m "Fix Admin magic-link token verification type"
          git push
