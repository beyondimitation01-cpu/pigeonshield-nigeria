name: KFS Fix Admin OTP Type

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply minimal Admin login fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/lib/store.tsx")
          text = path.read_text()
          old = '''        const { error: otpError } = await supabase.auth.verifyOtp({\n          type: "magiclink",\n          token_hash: data.tokenHash,\n        });'''
          new = '''        const { error: otpError } = await supabase.auth.verifyOtp({\n          type: "email",\n          token_hash: data.tokenHash,\n        });'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one Admin OTP block, found {count}")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/store.tsx .github/workflows/kfs-fix-admin-otp-type.yml
          git commit -m "Fix Admin magic-link token verification type"
          git push
