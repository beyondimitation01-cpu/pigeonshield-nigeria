name: Verify confirmation UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    if: github.event.head_commit.message != 'Remove temporary confirmation UI verification workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Remove temporary verification workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/verify-confirmation-ui.yml
          git add .github/workflows/verify-confirmation-ui.yml
          git commit -m "Remove temporary confirmation UI verification workflow"
          git push
