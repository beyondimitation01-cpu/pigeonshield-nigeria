name: Verify confirmation UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    if: github.event.head_commit.message != 'Remove temporary confirmation UI verification workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - name: Remove temporary verification workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/verify-confirmation-ui.yml
          git add .github/workflows/verify-confirmation-ui.yml
          git commit -m "Remove temporary confirmation UI verification workflow"
          git push
