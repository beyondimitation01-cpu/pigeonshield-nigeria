import {
  AlertDialog,
  AlertDialogAction,
  AlertDialogCancel,
  AlertDialogContent,
  AlertDialogDescription,
  AlertDialogFooter,
  AlertDialogHeader,
  AlertDialogTitle,
  AlertDialogTrigger,
} from "@/components/ui/alert-dialog";

type ConfirmActionDialogProps = {
  title: string;
  description: string;
  confirmLabel: string;
  children: React.ReactNode;
  destructive?: boolean;
  onConfirm: () => Promise<boolean> | boolean;
};

/**
 * Reusable confirmation gate for destructive or high-impact actions.
 * The underlying mutation is never invoked until the user explicitly confirms.
 * Returning false keeps the dialog open after a failed mutation.
 */
export function ConfirmActionDialog({
  title,
  description,
  confirmLabel,
  children,
  destructive = true,
  onConfirm,
}: ConfirmActionDialogProps) {
  const [busy, setBusy] = useState(false);

  async function handleConfirm(event: React.MouseEvent) {
    event.preventDefault();
    if (busy) return;
    setBusy(true);
    try {
      const success = await onConfirm();
      if (success) {
        // Radix closes the dialog after the action event completes.
        // preventDefault above keeps it open until the mutation succeeds.
        (event.currentTarget as HTMLElement).click();
      }
    } finally {
      setBusy(false);
    }
  }

  return (
    <AlertDialog>
      <AlertDialogTrigger asChild>{children}</AlertDialogTrigger>
      <AlertDialogContent>
        <AlertDialogHeader>
          <AlertDialogTitle>{title}</AlertDialogTitle>
          <AlertDialogDescription>{description}</AlertDialogDescription>
        </AlertDialogHeader>
        <AlertDialogFooter>
          <AlertDialogCancel disabled={busy}>Cancel</AlertDialogCancel>
          <AlertDialogAction
            className={destructive ? "bg-destructive text-destructive-foreground hover:bg-destructive/90" : undefined}
            disabled={busy}
            onClick={handleConfirm}
          >
            {busy ? "Working..." : confirmLabel}
          </AlertDialogAction>
        </AlertDialogFooter>
      </AlertDialogContent>
    </AlertDialog>
  );
}
'''
          Path("src/components/site/ConfirmActionDialog.tsx").write_text(component)

          def edit(path, replacements):
              p = Path(path)
              s = p.read_text()
              original = s
              for old, new in replacements:
                  if old not in s:
                      raise SystemExit(f"Expected source pattern not found in {path}: {old[:120]!r}")
                  s = s.replace(old, new, 1)
              if s == original:
                  raise SystemExit(f"No changes made to {path}")
              p.write_text(s)

